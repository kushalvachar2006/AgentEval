# Infrastructure only (MongoDB) for local development.
# The port is bound to 127.0.0.1 so it is not exposed to your network.
name: agenteval-dev
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?run npm run init:env first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run npm run init:env first}
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes: { mongo_data: {} }
