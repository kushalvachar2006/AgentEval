# Serves the built website and proxies /api to the API container.
# Security headers are set here (and by the API for /api responses). If you put your own reverse proxy in front, keep them.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # HSTS is added by the TLS terminator (Caddy in docker-compose.prod.yml), never over plain HTTP.

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  location /api/ {
    # proxy_pass http://api:4000;   # docker-compose hostname (uncomment for local/compose use)
    proxy_pass http://agenteval-api:4000;   # Render private-network hostname (service name in render.yaml)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }
  # Hashed assets are immutable; index.html must never be cached so upgrades take effect at once.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options "nosniff" always; }
  location / { add_header Cache-Control "no-store"; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header Referrer-Policy "no-referrer" always; try_files $uri /index.html; }
}