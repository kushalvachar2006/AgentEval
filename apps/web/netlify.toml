# Place at apps/web/netlify.toml  (Netlify "Base directory" = apps/web)
# Browser calls /api/... on the Netlify domain; Netlify proxies it to Render => same-origin => no CORS.
# >>> Replace agenteval-api.onrender.com with your real Render API URL <<<

[build]
  base    = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 1) API proxy (must come BEFORE the SPA fallback)
[[redirects]]
  from   = "/api/*"
  to     = "https://agenteval-api.onrender.com/api/:splat"
  status = 200
  force  = true

# 2) SPA fallback for React routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers (same as nginx.conf)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"